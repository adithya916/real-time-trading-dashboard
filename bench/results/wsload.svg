<circle cx="112.9" cy="245.3" r="4" fill="#0f766e" stroke="#0f766e" stroke-width="2"><title>one message per tick: 1,000 asked, 1,000 connected, p99 119.0 ms</title></circle>
<circle cx="177.1" cy="184.5" r="4" fill="#ffffff" stroke="#0f766e" stroke-width="2"><title>one message per tick: 2,500 asked, 1,953 connected, p99 442.1 ms</title></circle>
<circle cx="284.3" cy="175.4" r="4" fill="#ffffff" stroke="#0f766e" stroke-width="2"><title>one message per tick: 5,000 asked, 2,133 connected, p99 538.1 ms</title></circle>
<circle cx="498.6" cy="171.8" r="4" fill="#ffffff" stroke="#0f766e" stroke-width="2"><title>one message per tick: 10,000 asked, 2,133 connected, p99 581.1 ms</title></circle>
<line x1="536" x2="556" y1="50" y2="50" stroke="#0f766e" stroke-width="2"/>

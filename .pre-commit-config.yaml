# Install once with: pre-commit install
# Run on everything with: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Uses the Prettier version pinned in web/package.json, the same one CI runs.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: node web/node_modules/prettier/bin/prettier.cjs --write --ignore-unknown
        language: system
        files: ^web/
        exclude: ^web/package-lock\.json$

name: bench-load

# The WebSocket load test: the Compose stack on a GitHub runner, and bench/wsload stepping up
# viewers on the simulated BTC-SIM feed. Pull requests run a short ramp; run it by hand
# (workflow_dispatch) for the full one. Trend only: never required for a merge.
on:
  workflow_dispatch:
    inputs:
      steps:
        description: Viewer counts to hold, increasing
        default: "500,1000,2500,5000,10000"
      hold:
        description: How long each step is measured
        default: "60s"
      rate:
        description: New connections per second while ramping
        default: "500"
      workers:
        description: Gateway processes (GATEWAY_WORKERS)
        default: "4"
  pull_request:
    paths:
      - 'bench/wsload/**'
      - 'services/gateway/**'
      - '.github/workflows/bench-load.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bench/wsload
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"
          cache-dependency-path: bench/wsload/go.sum
      - name: go.mod and go.sum are tidy and verified
        run: |
          go mod tidy
          go mod verify
          git diff --exit-code -- go.mod go.sum || { echo "::error::run go mod tidy and commit go.mod and go.sum (CI's versions are in the go-modules artifact)"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-modules
          path: |
            bench/wsload/go.mod
            bench/wsload/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  load:
    needs: go
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STEPS: ${{ github.event.inputs.steps || '100,500,1000,2000' }}
      HOLD: ${{ github.event.inputs.hold || '20s' }}
      RATE: ${{ github.event.inputs.rate || '250' }}
      GATEWAY_WORKERS: ${{ github.event.inputs.workers || '4' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"
          cache-dependency-path: bench/wsload/go.sum
      - name: Build the load generator
        working-directory: bench/wsload
        run: |
          go build -o wsload .
      - name: Raise connection limits
        run: |
          sudo sysctl -w net.ipv4.ip_local_port_range="1024 65535"
          sudo sysctl -w net.core.somaxconn=8192
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Wait for the simulated feed
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/symbols | grep -q BTC-SIM && exit 0
            sleep 1
          done
          exit 1
      - name: Load test
        run: |
          ulimit -n 65536
          mkdir -p bench/results
          ./bench/wsload/wsload -url ws://localhost:8080/ws/sim/BTC-SIM \
            -steps "$STEPS" -hold "$HOLD" -rate "$RATE" -csv bench/results/wsload.csv | tee table.md
          {
            echo "### WebSocket load: steps $STEPS, $HOLD each, $GATEWAY_WORKERS gateway workers"
            echo
            grep '^|' table.md
            echo
            echo "Runner: $(nproc) CPUs, $(free -g | awk '/Mem:/{print $2}') GB"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Gateway latency while loaded
        if: always()
        run: python3 scripts/metrics_smoke.py http://localhost:8080/metrics || true
      - name: Container resource use
        if: always()
        run: docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wsload-results
          path: |
            bench/results/wsload.csv
            table.md
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200 gateway simulator
      - name: Stop the stack
        if: always()
        run: docker compose down -v

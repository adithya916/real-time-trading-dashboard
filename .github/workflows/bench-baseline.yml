name: bench-baseline

# Measures the stack on a GitHub-hosted runner, so later results are compared on the
# same kind of machine. Trend only: this workflow never blocks a merge.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'bench/**'
      - '!bench/results/**'
      - '.github/workflows/bench-baseline.yml'

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Run the baseline benchmark
        working-directory: bench
        env:
          BENCH_MACHINE: GitHub Actions ubuntu-latest
        run: uv run --frozen --python 3.12 python baseline/run.py --out results/baseline
      - name: Publish the report on the run page
        run: cat bench/results/baseline.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-results
          path: bench/results/baseline.*
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v

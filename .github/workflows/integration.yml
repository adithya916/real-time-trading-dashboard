name: integration

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      stack: ${{ steps.filter.outputs.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            stack:
              - 'services/**'
              - 'deploy/**'
              - 'compose.yaml'
              - 'scripts/ws_smoke.py'
              - '.github/workflows/integration.yml'

  stack:
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
      - name: Validate Compose files
        run: docker compose config --quiet
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Health check
        run: curl -fsS http://localhost:8000/health
      - name: WebSocket smoke test
        run: uv run --no-project --python 3.12 --with websockets==12.0 python scripts/ws_smoke.py ws://localhost:8000/ws/stream/AAPL
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  integration-ok:
    if: always()
    needs: [changes, stack]
    runs-on: ubuntu-latest
    steps:
      - name: All integration jobs passed or were skipped
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then exit 1; fi

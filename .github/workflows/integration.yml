name: integration

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      stack: ${{ steps.filter.outputs.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            stack:
              - 'services/**'
              - 'deploy/**'
              - 'compose.yaml'
              - 'scripts/bus_smoke.py'
              - 'scripts/ingest_smoke.py'
              - 'scripts/analytics_smoke.py'
              - 'scripts/gateway_smoke.py'
              - 'scripts/history_smoke.py'
              - 'scripts/replay_smoke.py'
              - 'proto/**'
              - '.github/workflows/integration.yml'

  stack:
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
      - name: Validate Compose files
        run: docker compose config --quiet
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Gateway health check
        run: curl -fsS http://localhost:8080/health
      - name: Generate Protobuf code
        run: bash scripts/gen_proto.sh
      - name: NATS JetStream smoke test
        run: uv run --project services/common --frozen --python 3.12 python scripts/bus_smoke.py nats://localhost:4222
      - name: Wait until analytics and the gateway are subscribed
        # Core NATS doesn't replay, so a consumer that subscribes after the replay misses it.
        run: |
          for i in $(seq 1 60); do
            names=$(curl -fsS 'http://localhost:8222/connz' | jq -r '.connections[] | select(.subscriptions > 0) | .name')
            if echo "$names" | grep -qx analytics && echo "$names" | grep -qx gateway; then exit 0; fi
            sleep 1
          done
          echo "subscribed: $names"; exit 1
      - name: Replay a Kraken recording through ingest into NATS
        run: |
          uv run --project services/ingest --frozen --python 3.12 python -m ingest.service             --bus nats://localhost:4222 --replay services/ingest/tests/fixtures/kraken_btcusd.jsonl.gz kraken:BTC-USD
          uv run --project services/ingest --frozen --python 3.12 python scripts/ingest_smoke.py nats://localhost:4222
      - name: Analytics published metrics for the replayed book
        run: uv run --project services/ingest --frozen --python 3.12 python scripts/analytics_smoke.py nats://localhost:4222
      - name: Candle history from TimescaleDB matches a DuckDB recomputation
        run: >-
          uv run --project services/ingest --frozen --python 3.12 --with duckdb==1.1.3
          python scripts/history_smoke.py http://localhost:8080 services/ingest/tests/fixtures/kraken_btcusd.jsonl.gz
      - name: The gateway serves the replayed book over WebSocket
        run: uv run --project services/gateway --frozen --python 3.12 python scripts/gateway_smoke.py ws://localhost:8080/ws/kraken/BTC-USD
      - name: A recorded Parquet session replayed through the bus rebuilds the golden books
        run: |
          uv run --project services/recorder --frozen --python 3.12 python -m recorder binance BTC-USDT             --from-recording services/ingest/tests/fixtures/binance_btcusdt.jsonl.gz --root /tmp/parquet
          uv run --project services/recorder --frozen --python 3.12 python -m recorder.replay             --root /tmp/parquet --bus nats://localhost:4222 --speed 50 binance:BTC-USDT
          uv run --project services/recorder --frozen --python 3.12 python scripts/replay_smoke.py             nats://localhost:4222 binance BTC-USDT services/ingest/tests/golden/binance_btcusdt.json
      - name: Build the ingest image
        run: docker compose --profile feeds build ingest
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  integration-ok:
    if: always()
    needs: [changes, stack]
    runs-on: ubuntu-latest
    steps:
      - name: All integration jobs passed or were skipped
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then exit 1; fi

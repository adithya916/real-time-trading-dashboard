name: ci-python

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'services/**'
              - 'proto/**'
              - 'scripts/**'
              - 'bench/**'
              - 'buf.yaml'
              - 'ruff.toml'
              - '.github/workflows/ci-python.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
      - name: Ruff (whole repo)
        run: |
          uvx ruff@0.8.4 check .
          uvx ruff@0.8.4 format --check .

  proto:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUF_VERSION: "1.47.2"
    steps:
      - uses: actions/checkout@v4
      - name: Install buf
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" -o "$HOME/.local/bin/buf"
          chmod +x "$HOME/.local/bin/buf"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: buf lint
      - name: Format
        run: buf format --diff --exit-code
      - name: Compile
        run: buf build -o /dev/null

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [legacy, common]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Generate Protobuf code
        working-directory: .
        run: bash scripts/gen_proto.sh
      - name: Install
        run: uv sync --frozen --python 3.12
      - name: Typecheck
        run: uv run mypy .
      - name: Test
        run: uv run pytest -q

  # The one check branch protection requires. It passes when every job above
  # passed or was skipped by the path filter, so matrix and filter changes never
  # rename the required check.
  python-ok:
    if: always()
    needs: [changes, lint, proto, python]
    runs-on: ubuntu-latest
    steps:
      - name: All Python jobs passed or were skipped
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then exit 1; fi

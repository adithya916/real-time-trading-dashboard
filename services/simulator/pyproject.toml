[project]
name = "simulator"
version = "0.1.0"
description = "Agent-based simulated venue: zero-intelligence order flow around a random-walk fair value, matched by the C++ engine."
requires-python = ">=3.10,<3.13"
dependencies = [
    "mdcommon",
    "ingest",
    "bookcore",
]

[tool.uv.sources]
mdcommon = { path = "../common", editable = true }
ingest = { path = "../ingest", editable = true }
# Built from source with scikit-build-core (CMake and a C++20 compiler).
bookcore = { path = "../../core" }
papertrader = { path = "../papertrader", editable = true }

[dependency-groups]
dev = [
    # End-to-end test: the paper trader against this venue.
    "papertrader",
    "pytest==8.3.4",
    "pytest-timeout==2.3.1",
    "mypy==1.14.1",
    "types-protobuf==5.29.1.20241207",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ['^\.venv/']

[[tool.mypy.overrides]]
module = ["mdcommon.gen.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["nats", "nats.*"]
ignore_missing_imports = true

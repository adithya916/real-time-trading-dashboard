[project]
name = "mdcommon"
version = "0.1.0"
description = "Code shared by every service: the generated market data schema and helpers around it."
requires-python = ">=3.10,<3.13"
dependencies = [
    "protobuf==5.29.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "mypy==1.14.1",
    "types-protobuf==5.29.1.20241207",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdcommon"]
# The generated code is git-ignored, so list it explicitly or the wheel would skip it.
artifacts = ["src/mdcommon/gen/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ['^\.venv/', '/gen/']

[[tool.mypy.overrides]]
module = "mdcommon.gen.*"
ignore_errors = true

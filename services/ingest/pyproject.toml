[project]
name = "ingest"
version = "0.1.0"
description = "Connects to market data venues, keeps their order books correct, and emits normalized marketdata.v1 events."
requires-python = ">=3.10,<3.13"
dependencies = [
    "mdcommon",
    "websockets==13.1",
]

[tool.uv.sources]
mdcommon = { path = "../common", editable = true }

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-timeout==2.3.1",
    "hypothesis==6.122.3",
    "mypy==1.14.1",
    "types-protobuf==5.29.1.20241207",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
timeout = 60

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ['^\.venv/']

[[tool.mypy.overrides]]
module = "mdcommon.gen.*"
ignore_errors = true

[project]
name = "recorder"
version = "0.1.0"
description = "Writes normalized marketdata.v1 envelopes to hourly Parquet files for replay and research."
requires-python = ">=3.10,<3.13"
dependencies = [
    "mdcommon",
    "ingest",
    "pyarrow==18.1.0",
]

[tool.uv.sources]
mdcommon = { path = "../common", editable = true }
ingest = { path = "../ingest", editable = true }

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-timeout==2.3.1",
    "mypy==1.14.1",
    "types-protobuf==5.29.1.20241207",
    "pyarrow-stubs==17.11",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ['^\.venv/']

[[tool.mypy.overrides]]
module = "mdcommon.gen.*"
ignore_errors = true

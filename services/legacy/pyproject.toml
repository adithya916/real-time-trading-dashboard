[project]
name = "legacy-backend"
version = "0.1.0"
description = "Original FastAPI + Redis market data server, kept running until the new services replace it on Day 4."
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn==0.27.0",
    "redis==5.2.1",
    "websockets==12.0",
    "python-dotenv==1.0.0",
    "orjson==3.9.10",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-timeout==2.3.1",
    "fakeredis==2.26.2",
    "httpx==0.27.2",
    "mypy==1.14.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
timeout = 120

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
exclude = ['^\.venv/']

[project]
name = "analytics"
version = "0.1.0"
description = "Mirrors books from the bus and publishes market microstructure metrics."
requires-python = ">=3.10,<3.13"
dependencies = [
    "mdcommon",
    "ingest",
]

[tool.uv.sources]
mdcommon = { path = "../common", editable = true }
ingest = { path = "../ingest", editable = true }

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-timeout==2.3.1",
    "hypothesis==6.122.3",
    "mypy==1.14.1",
    "types-protobuf==5.29.1.20241207",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ['^\.venv/']

[[tool.mypy.overrides]]
module = ["mdcommon.gen.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["nats", "nats.*"]
ignore_missing_imports = true

services:
  timescale:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: md
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-md-local-only}
      POSTGRES_DB: md
      # The image tunes memory to the whole machine by default; keep it small.
      TS_TUNE_MEMORY: 512MB
    volumes:
      - timescale-data:/var/lib/postgresql/data
    ports:
      - "${TIMESCALE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "md", "-d", "md"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  timescale-data:

# Scrapes every service's /metrics on the Compose network. Names and ports come from
# deploy/compose/*.yaml and each service's --metrics-port default.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # One target per gateway worker (GATEWAY_WORKERS, default 4: metrics on 9110 + worker index).
  - job_name: gateway
    static_configs:
      - targets: ["gateway:9110", "gateway:9111", "gateway:9112", "gateway:9113"]
  - job_name: ingest
    static_configs: [{ targets: ["ingest:9101"] }]
  - job_name: analytics
    static_configs: [{ targets: ["analytics:9102"] }]
  - job_name: simulator
    static_configs: [{ targets: ["simulator:9103"] }]
  - job_name: papertrader
    static_configs: [{ targets: ["papertrader:9104"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
